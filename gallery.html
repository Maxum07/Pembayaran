<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>❤️</title>

    <link rel="stylesheet" href="nganu.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Background -->
    <div class="bg-glow"></div>

    <!-- Floating Hearts -->
    <div class="floating-hearts">
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
    </div>

    <!-- Header -->

    <section class="hero">

        <h1>Scroll kebawah❤️</h1>

        <p>
           semoga membaik
        </p>

    </section>

    <!-- LOVE SHAPE -->

    <section class="gallery-section">

<div class="gallery-section">

    <div id="photoGallery"
         class="photo-gallery">
    </div>

</div>

    </section>

    <!-- Caption -->

    <section class="caption">

        <h2>
            Every memory with you is my favorite memory.
        </h2>

    </section>

    <!-- Gift -->

    <section class="gift-section">

        <h1>
            Choose Your Gift 🎁
        </h1>

        <p>
            I prepared something special only for you.
        </p>

        <div class="gift-container">

            <div class="gift-card" data-gift="1">

                🎁

                <h3>Gift One</h3>

            </div>

            <div class="gift-card" data-gift="2">

                🌹

                <h3>Gift Two</h3>

            </div>

            <div class="gift-card" data-gift="3">

                💌

                <h3>Gift Three</h3>

            </div>

        </div>

    </section>

    <!-- Popup -->

    <div class="popup" id="popup">

        <div class="popup-box">

            <h2 id="popupTitle">
                Gift
            </h2>

            <p id="popupText">

                Secret Message

            </p>

            <button id="closePopup">

                Close ❤️

            </button>

        </div>

    </div>

    <!-- Lightbox -->

    <div id="lightbox">

        <img id="lightbox-img">

    </div>

    <script src="sekerip.js"></script>

</body>

</html>
